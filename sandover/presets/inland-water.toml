# Inland water (`inland` was chosen in revision 3): the water-anim actors that are not the ocean
# read as clear water, and Misty's quicksand as wet mud. The engine defaults (gfx.h inland_*) are
# this preset, so play needs no forms; `off` turns both parts off for an A/B. Rig: the forms of
# `sandover-preset apply inland-water <inland|off>`. Engine side: InlandWater.h/.cpp (the table
# InlandWater.inc is generated by `python -m sandover.inland_water`), merc2.frag, generic.frag.
# Both parts ride on the class shading (PBR on); the depth part reads SSAO's depth copy (SSAO on).
#
# [presets.<name>.water]  clear water: ponds, lakes, the jungle river, the village fountain and
#                         rice paddies, the sunken pools, the purple cave pools
#   depth_m   view-ray length through the water that reaches 63 % of the game's own tint (m);
#             the shore is clear, deep water is the game's colour and alpha
#   refl      fresnel reflection strength of the mood sky (levels with a sky only)
#   refl_cap  largest reflection weight, 0..1
#   glint     sun glint on the game's ripple normals (levels with a sky only)
# [presets.<name>.mud]    Misty's quicksand (opaque)
#   dark      colour multiplier, 0..1
#   refl_cap  largest reflection weight, 0..1
#   rough     roughness of the reflection and the sun lobe, 0..1
#   glint     broad sun lobe strength
# picked     optional, true (no preset sets it): revision 1's B as it showed on Merc2 water on sky levels: the game's water with
#            only its envmap layer dropped (a merc view-vector sign bug disabled the merc shading).
#            Revision 1's B also gave Generic2 water (sunken pools) its depth fade; this mode turns
#            that off too. pc-set-inland-water 11
# caption    one line for the screening grid: what visibly differs, never parameters

[meta]
schema = 1
phase = "inland-water"
round = 1

[presets.inland]
label = "Inland water"
caption = "ponds, rivers and pools clear at the shore and tinted in the deep, sky and sun on the ripples; darker glossy mud"

[presets.inland.water]
depth_m = 1.5
refl = 1.0
refl_cap = 0.5
glint = 1.0

[presets.inland.mud]
dark = 0.8
refl_cap = 0.15
rough = 0.35
glint = 0.3
