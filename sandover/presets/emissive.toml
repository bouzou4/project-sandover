[emissive_lights]
# Screen-space emissive tile lights: emissive pixels (E mask x frame colour) are
# pooled into a 64-wide tile grid, the 32 brightest tiles become point lights, and opaque
# pixels within `radius_m` get a soft coloured glow. Needs SSAO on. Engine:
# game/graphics/opengl_renderer/EmissiveLights.h; forms from `sandover-preset apply emissive <name>`
# (`default` is this table, `off` disables). Finding: kb/findings/2026-09-25-emissive-tile-lights.md.
intensity = 8.0     # pc-set-emissive-lights 1: scale of the added light
radius_m = 4.0      # pc-set-emissive-lights 2: metres from a light at which its glow ends
falloff = 2.0       # pc-set-emissive-lights 3: exponent of (1 - d / radius)
threshold = 0.02    # pc-set-emissive-lights 4: mean tile flux (luma) below which a tile is no light
# Fixed in EmissiveLights.cpp, not knobs: a tile is thin (arcs, sparks; keeps 15% of its power)
# once its fill drops under 0.2 and compact again above 0.5; summed light soft-limited to 0.35 luma.
# World light list: the nearest `world_count` census emitters that are on
# become lights too, so vents, cells, lamps and crystals keep lighting when off screen or small.
# Table: `sandover-lights bake` (kb/howto/lights.md). Power = colour x class intensity x gain;
# world lights have priority: the tiles near one give no light (world_suppress below).
world_count = 16            # pc-set-emissive-lights 5: lights per frame, 0 = off (max 32)
world_strong = 0.08         # 6: vents, power cells, crystals, lava, lit precursor trim
world_weak = 0.01           # 7: eco, crate contents, race rings (orbs are not in the table)
world_arc = 0.005           # 8: lightning arcs (fixed; the tiles near them give no light)
world_particle = 0.05       # 9: part spawners, times the group's light strength
world_radius_scale = 1.0    # 10: times the baked radius
world_radius_max_m = 8.0    # 11: cap on a world light's radius
world_lamp = 0.12           # 12: lamps and torches (static E on night / flame slots)
world_glow = 0.3            # 18: props lit by design (snow ice crystals); 8 tile slots of their own
eco_strength = 2.5          # 28: eco shots and blasts, power per unit of the group's colour; 4 tile slots; 27 = on/off
# Highlights: every tile, world and actor light also adds a GGX lobe from the material
# shading's roughness and F0 (carried in the emissive mask's b, a). Needs material shading.
highlights = 1.0            # 20: on / off
highlight_strength = 2.0    # 21: scale of the lobe
highlight_max = 1.5         # 22: soft limit of the summed highlight (brightest channel)
highlight_damp = 0.5        # 23: roughness cut on porous classes in enclosed (one-slot) levels
# Temporal stability (snapshot run 2026-09-25: lava and orb light flickered with camera motion).
# Candidate tiles are matched to 32 fixed world-space light slots (LightTracker.h); per frame, not
# per second. A world light takes over every tile within world_suppress x its radius.
temporal_blend = 0.25       # 13: share of the new tile position/colour/power taken per frame (1 = none)
temporal_frames = 3         # 14: frames a tile light must be seen to appear, or missed to go
fade_frames = 8             # 15: frames of fade in and out
world_suppress = 1.0        # 16: tiles within this x a world light's radius give no light (0 = off)

# `sandover-lights bake` settings (not engine knobs); the table is compiled into gk.
[emissive_lights.bake]
static_cap = 48             # static clusters kept per level, biggest energy (E x lit area) first
lava_cap = 256              # lava clusters (role lava) per level, their own cap: lava lights from the table
static_energy_ref = 1.0     # a static's gain = min(1, energy / this)
radius_cap_m = 12.0         # baked radius = min(cap, max(census hint, class floor))
radius_min = { lamp = 7.0 } # class floors: a lamp hangs 2-3 m over the street it lights
named_cap = 128             # statics on textures named as lights (rol-light, fin-light) per level, their own cap
glass_cap = 512             # statics on lamp glass per level, their own cap (all of them: citadel has 260)
glass_gain = 4608.0         # lamp glass bakes as class weak x this (no actor light): lights the wall as the tiles it replaced
prop_cap = 256              # prop lights (prop_lights.json) per level; lavatube has 247 vent-fire tiles

# Rig debug baseline for `sandover-lights flicker --baseline`: no smoothing, no hysteresis, no
# fade, no world priority. Not the pre-tracking build; that baseline is a master build.
[emissive_lights.presets.unsmoothed]
temporal_blend = 1.0
temporal_frames = 1
fade_frames = 1
world_suppress = 0.0
