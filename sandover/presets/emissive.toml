# Emissive tuning. Read by `sandover-materials emitter-score`
# (sandover/tools/sandover/materials/emitter_score.py); see kb/howto/materials.md "Emitter score".
#
# The score separates true emitters (lamps, lava, crystals, screens) from lit receivers (walls,
# logs, stones that the bake lit with a lamp's light). It is a logistic of a weighted sum:
#
#   p = 1 / (1 + exp(-(bias + sum_i weight_i * component_i)))
#
# Every component is in [0, 1] except `correlation`, which is in [-1, 1]. Positive weights push
# towards "emitter", negative towards "receiver".

[emitter_score]
bias = -1.0
# Texels at or above this E count as covered (same as the emissive maps' COVERED).
covered = 0.1
# Texels with alpha at or below this are ignored (PS2 alpha 128 = opaque, stored as 128/255).
alpha_min = 0.05
# Score at or above which a texture is an emitter. `--validate` lowers it if a human-confirmed
# emitter scores below it (kb/findings/2026-09-24-emitter-score.md).
threshold = 0.5

[emitter_score.weights]
# (a) Pearson correlation between the E map and the albedo luma over opaque texels.
correlation = 2.0
# (b) Fraction of texels with E >= covered. Receivers under a lamp are lit all over.
coverage = -1.5
# (c) Mean corner falloff (max - min) / max of E over the lit triangles drawing the texture.
gradient = -3.0
# (d) Fraction of the texture's triangles, over every level, that are lit.
consistency = 3.0
# (e) Prior of the dominant E source (table below).
slot = 2.0
# (f) E-weighted mean albedo luma: emitters are bright where they glow.
brightness = 3.0

[emitter_score.slot_prior]
# Dominant mood slot role of the texture's E (emissive-maps index `role`).
flames = 0.8
lava = 0.9
light = 0.6
fade-lights = 0.6
static = 0.6
night = 0.4
lightning = 0.1
caustics = 0.1
fade = 0.1
# Luminance-sourced maps: a human marked the texture emissive, or it is a named lava fallback.
luminance = 1.0

[emitter_score.ladder]
# Queue defaults: receivers start at this strength (the ladder's lowest step).
receiver_default = 0.015625

[emitter_score.export]
# `sandover-unbake export-sidecar` multiplies the E of every receiver (score below the
# threshold, not an anchor, no human row) by this. 0 = receivers stop glowing, 1 = as baked.
# Human ladder rows and overrides always win; anchors and human emitters are never scaled.
receiver_scale = 0.0

[actor_emissive]
# E for textures the bake cannot flag: particles (sprite renderer) and merc models.
# Read by `sandover-materials actor-emissive` (sandover/tools/sandover/materials/actor_emissive.py),
# which seeds override and ladder rows and exports the engine table; see kb/howto/materials.md
# "Actor emissive table" and kb/findings/2026-09-24-eco-brightness.md.
#
# Rule: bloom adds about strength x w x (peak - threshold) inside an element, w = smoothstep(ramp, E).
# The ladder step is the highest quarter octave that keeps the element's baked peak under `cap`.
ramp = [0.1, 0.4]   # the engine's E ramp (pc-set-ssao-param 16/17 defaults)
threshold = 0.3     # bloom threshold (pc-set-bloom 3 default)
strength = 1.0      # bloom strength (pc-set-bloom 1 default)
cap = 0.98
# The look on top of the rule, in octaves of E: 1 = rule + 1 octave (eco-001 pick D).
# Safe for colour only with the engine's hue-preserving bloom clip (pc-set-bloom 4, on by default).
octaves = 1.0

# peak: the element's baked peak (90th percentile of the brightest channel over its brightest
# unclipped pixels) at 23:00 in vanilla, from the eco-emitters shots; the brightest element using the
# texture wins. peak = 1.0: the element already clips in vanilla (vent 30%, power cell 10% of its
# box at 1.0 at night, about half at noon), so no step above the ramp keeps it under the cap;
# `step` then sets it directly.
# min_chroma (sprites only): particle textures are shared (bigpuff is also dust and smoke), so a
# sprite writes E only where its vertex colour is at least this saturated.
# lights (default 1): share of the texture's E that feeds the screen-space tile lights. Bloom and
# the SSAO fade always take the full E. 0 = glows and blooms but lights nothing (precursor orbs,
# design decision 2026-09-26). Engine: emissive mask green, see kb/howto/ssao.md.
[[actor_emissive.textures]]
name = "bigpuff"
combo_id = "0x00020000"
tpage = "effects"
element = "eco puffs, fire"
peak = 0.61
min_chroma = 0.5

