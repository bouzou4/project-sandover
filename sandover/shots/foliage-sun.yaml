# Backlit leaves with sun transmittance, confirmation of the chosen look (B2) on the merge build.
# Bin foliage-sun-occlusion-5, SANDOVER_GK_PROJ_PATH at worktrees/foliage-sun-occlusion-5-root.
# Every arm's forms are ONE
# after-load string: the clock pin, the play look (reset, reapply, update), the Sandover wave clock
# pin, then the variant. Do NOT also pass --play-look (it would add a second string). C gets the
# clock pin only. Toggles persist within an instance; C first (vanilla boot).
#   A  (no backlight):                      26 0, 27 0, 28 0, 30 0
#   B1 (backlight as before):              26 1, 27 1, 28 1, sun occlusion off (30 0)
#   B2 (with sun transmittance):            B1 + 30 1, density 31 2.5
#   B3 (stronger backlight, with occlusion): 26 2 (double leaf transmission), 30 1, 31 2.5
# Canopy shade (shadow option 11) is off in every arm. Same clocks in every arm: the stage hook
# moves all game clocks to 100000 s 4 frames before the shot (rig-set-clock), the wave clock is
# pinned at 120 s (water option 90), wind is off and actors frozen (rig default), so only the
# backlight differs.
# Cameras from existing frames (BUILD-RULES camera rule):
# - village1-hut-dusk: class-response-002/B/village1-hut-dusk.png (pose pinned here
#   rather than from_continue, so the arms align).
# - village1-palm-sun: class-response-002/B/village1-palm-sun.png (looking up through
#   the fronds toward the 15 h sun: fronds with other fronds between them and the sun).
# - jungle-canopy-sun: foliage-sun-001/B1/jungle-canopy-sun.png.
# village1-palm-whole is dropped (foreground bush and plank, small palm).
# What foliage-sun-001 showed (pixel diffs of the captured frames, hut-dusk): B1 reproduces the
# class-response-002 B glow on the palms (+12 to +19 levels on the palm crowns, about 1% of this
# wide frame); class-response-002's larger share of changed pixels came from the water and a
# 1.4 degree camera difference, not the palms. B2 takes the glow of the palms behind the buildings
# to about 0 (four crowns: +14 -> 0, +17 -> +3, +12 -> 0, +19 -> 0) and keeps it on open
# foreground plants (+12.8 -> +12.8, +12.0 -> +11.7). B3 doubles the glow where it survives.
schema: 1
set: foliage-sun-006
looks:
  A: &A
    - '(set! *rig-stage-hook* (lambda () (rig-set-clock (seconds 100000)) (none))) (sandover-settings-reset! (-> *pc-settings* sandover)) (sandover-settings-reapply) (sandover-settings-update) (pc-set-water 90 120000000) (pc-set-pbr-param 26 0) (pc-set-pbr-param 27 0) (pc-set-pbr-param 28 0) (pc-set-pbr-param 30 0) (pc-set-shadow-option 11 0)'
  B1: &B1
    - '(set! *rig-stage-hook* (lambda () (rig-set-clock (seconds 100000)) (none))) (sandover-settings-reset! (-> *pc-settings* sandover)) (sandover-settings-reapply) (sandover-settings-update) (pc-set-water 90 120000000) (pc-set-pbr-param 26 1000000) (pc-set-pbr-param 27 1000000) (pc-set-pbr-param 28 1) (pc-set-pbr-param 30 0) (pc-set-shadow-option 11 0)'
  B2: &B2
    - '(set! *rig-stage-hook* (lambda () (rig-set-clock (seconds 100000)) (none))) (sandover-settings-reset! (-> *pc-settings* sandover)) (sandover-settings-reapply) (sandover-settings-update) (pc-set-water 90 120000000) (pc-set-pbr-param 26 1000000) (pc-set-pbr-param 27 1000000) (pc-set-pbr-param 28 1) (pc-set-pbr-param 30 1) (pc-set-pbr-param 31 2500000) (pc-set-shadow-option 11 0)'
  B3: &B3
    - '(set! *rig-stage-hook* (lambda () (rig-set-clock (seconds 100000)) (none))) (sandover-settings-reset! (-> *pc-settings* sandover)) (sandover-settings-reapply) (sandover-settings-update) (pc-set-water 90 120000000) (pc-set-pbr-param 26 2000000) (pc-set-pbr-param 27 1000000) (pc-set-pbr-param 28 1) (pc-set-pbr-param 30 1) (pc-set-pbr-param 31 2500000) (pc-set-shadow-option 11 0)'
  C: &C  # original game: the clock pin only
    - '(set! *rig-stage-hook* (lambda () (rig-set-clock (seconds 100000)) (none)))'
defaults:
  resolution: [2560, 1440]
  msaa: 4
  settle_frames: 300
  effects: on
  wind: off
  particles: off
  jak: show
