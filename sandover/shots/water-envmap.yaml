# Reproducible ablation for #282 (the mid ocean envmap holes), step 3: each envmap factor
# alone at the beach snapshot camera, 3 frames per view (debug views 14-17; 14 shows the
# holes). Run with --preset water=bold; each shot sets the view itself.
set: water-envmap
defaults:
  resolution: [3840, 2054]
  msaa: 4
  settle_frames: 120
  effects: on
  wind: off
  particles: off
  jak: show
