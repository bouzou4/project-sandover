# Misty Island sea mist revision 2: a low layer over the sea and shore (base 0 m, scale
# height 6 m, from 10 m out), thickening with distance, softening the feet of cliffs and pillars
# while their tops stay clearer. Three cameras, each as C original game (vanilla: no forms), A
# today (the play look, sea mist off), B1 moderate (`sandover-preset apply misty
# moderate`, the pick) and B2 strong (`strength` 2); particles and actors live so the designers'
# fog deck shows. Vanilla first; one instance. Cameras checked offline on the ripped background:
# - misty-crossing-noon: water.yaml's sea camera at (122, 1.5, 732) m, 1.5 m over the sea, at
#   noon: a long sight line across the water to the island's south shore and cliffs.
# - misty-shore-jak: 3.5 m over the beach behind Jak at the misty-start continue, looking
#   north-west past him along the shore to the sea and a rock pillar (nearest surface 7.4 m).
# - misty-pillars-dusk: the misty-start continue camera at (49.8, 8.9, 819.9) m turned to look
#   east across the bay at the rock pillars and bone arches, hour 18.5 (nearest 5.1 m).
# Each look is the play look minus HDR output, as shore-wet.yaml.
set: misty-mist
looks:
  A: &A  # today (this effect off)
    - '(set! *rig-stage-hook* (lambda () (rig-set-clock (seconds 100000)) (none)))'
    - '(pc-set-ssao-preset 4)'
