# Canopy shade revision 2, cameras v2. Model: see kb/findings/2026-09-30-canopy-shade.md
# section 3. A = today's play look (shadow option 11 = 0), B = canopy shade (11 = 1, 12-14 at the
# engine defaults), C = the original game (no forms), shot first.
# Cameras picked offline from the canopy map, the background glb (ray cast at an assumed 64 deg
# FOV: nothing within 1.9 m, canopy and sky in the top third) and decompiler_out/jak1/entities/
# jungle-actors.json: camera, Jak and the line between them 15 m or more from every moving or
# hazardous actor (logtrap, babak, hopper, snake, darkvine, lurker machines, launchers, springbox,
# periscopes ...), 3 m from orbs and crates; on jng-leafyground / jng-path ground above the river.
# - boundary: 2 m over ground in the open at (274, -129) m looking +x, pitched up 6 deg, into the
#   canopy; Jak 6.5 m ahead where the cover starts; top third 34% sky, 49% canopy. About 9% of
#   the frame (right edge, below the horizon) is open sea: compare away from it.
# - dense-path: 2 m over ground under full cover at (332, -210) m, looking (-x, +z), Jak 9 m ahead;
#   top third 69% canopy.
# 10:00 is the strongest case (the bake has no canopy shade with that sun); noon redistributes.
# Offline B/A of the ground in view (3-25 m, 30 deg cone; jungle fit vertices):
#   boundary noon mean 0.95 (p5 0.72, p95 1.15), 10:00 mean 0.84 (p5 0.55);
#   dense-path noon mean 1.00 (p5 0.88, p95 1.12), 10:00 mean 0.92 (p5 0.77).
# Bin canopy-shade-2, SANDOVER_GK_PROJ_PATH at worktrees/canopy-shade-2-root, SANDOVER_DATA set (maps).
