# Vanilla eco reference (kb/facts/eco.md): one framing per eco type, noon and night, particles on.
# Each camera is 6-10 m from the census emitter (data/lights/<level>.json), aimed 0.8 m below it so
# the emitter sits in the centre third with the ground it would light in frame; offline check on the
# level mesh: clear line to the emitter, 1.5 m clearance, visible ground within 5 m. Rot rows are
# inv-camera-rot, as orbs-no-light. Beach green vents sit under ecoventrocks on a new game, so
# green is rolling's open vent. maincave has no hour cycle: its noon and night frames match.
# Emitters: jungle:ventblue-2, rolling:ecovent-242, maincave:ecovent-252, snow:ecovent-201,
# village1:eco-10, training:fuel-cell-55, maincave:dark-crystal-3 (idle), maincave:dark-eco-pool-6.
set: eco-reference
defaults:
  resolution: [2560, 1440]
  msaa: 4
  settle_frames: 90
  camera: from_continue
  effects: on
  wind: off
  particles: on
  jak: hide
