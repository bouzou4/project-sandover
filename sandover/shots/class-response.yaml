    camera:
      pos: [2868823.5, 1055228.7, -14662158.0]
      rot: [-0.766045, 0.0, -0.642788, 0.089459, 0.990268, -0.106613, 0.636532, -0.139173, -0.758589]
  # 9 m from one boulder's lit-to-shade edge, 2 m above it (ground 1.4 m below the camera, the
