# Emissive tile lights: light from particles and emissive surfaces on nearby floor
# and walls. Run twice with SSAO deep and bloom on, tile lights off and on; see
# kb/findings/2026-09-25-emissive-tile-lights.md. Village1 has no eco vent actor, so the
# vent shot is the forbidden jungle's blue vent; darkcave-start has no lit crystal, so the third
# shot is the beach lamp.
set: tile-lights
defaults:
  resolution: [2560, 1440]
  msaa: 4
  settle_frames: 90
  camera: from_continue
  effects: on
  wind: off
  particles: on
  jak: hide
shots:
  - {name: jungle-top-cell-night, continue: jungle-start, hour: 23, camera: {pos: [1462272.0, 462848.0, -974848.0], rot: [-0.7674, 0.0, -0.6411, 0.134, 0.9779, -0.1604, 0.627, -0.209, -0.7505]}}
  - {name: jungle-vent-night, continue: jungle-start, hour: 23, camera: {pos: [1417216.0, 245760.0, -851968.0], rot: [-0.5952, 0.0, -0.8036, 0.2636, 0.9447, -0.1952, 0.7591, -0.328, -0.5623]}}
  - {name: beach-lamp-night, continue: beach-start, hour: 23}
