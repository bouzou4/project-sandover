# Sunken caustics revision 3. Revision 2 was unusable: shovers and bullies filled both frames and
# the web moved the caustic-lit floor by 3-15 levels. The look now scales with the caustic light
# (B1 gathers half of it into the web's lines, B2 all of it). Cameras come from captured frames:
# - start: sunken-start room, wide (highlights-001/sunken-precursor-pad-A), no enemy
#   within 45 m; floor and platform caustic-lit (24 % of the frame on the rip)
# - poolbed: the pool bed under sunken-water seen from the walkway (sunken-caustics-001/
#   pool-A-f120), no enemy within 45 m; bed 60 % of the frame, the original's strongest caustics
# - slope: sunkenb floor (sunken-caustics-002/slope-A-f120) turned 45 degrees right and
#   10 down about the same position, away from the bullies that filled revision 2's frame; floor 88 %
# Arms: C original game, A today (play look, original loop), B1 web-sharp, B2 web-strong (neither
# kept as a preset since `web` was picked); one frame each.
# Stage hook in every arm: every game clock to the next t = 13700 mod 36000 ticks (each synced
# sunken-water is in its safe phase for 450 ticks), 40 frames for a deadly fade to clear, then the
# original's caustic counter (state 1 of both sunken moods) and the pattern clock pinned to the same
# values, so the loop phase and the web match across arms. Actors: the rig's default freeze.
set: sunken-caustics
looks:
  C: &C
    - '(define-extern pc-set-caustics (function int int none))'
    - '(set! *rig-stage-hook* (lambda () (rig-set-clock (the time-frame (+ (* (/ (current-time) 36000) 36000) 36000 13700))) (dotimes (i 40) (suspend)) (set! (-> *sunken-mood* state 1) (the-as uint 116)) (set! (-> *sunkenb-mood* state 1) (the-as uint 116)) (pc-set-caustics 7 1933333) (none)))'
  A: &A
    - '(sandover-settings-reset! (-> *pc-settings* sandover))'
    - '(sandover-settings-reapply)'
    - '(set! (-> *pc-settings* sandover hdr-output) 2)'
    - '(define-extern pc-set-caustics (function int int none))'
    - '(pc-set-caustics 0 0)'
    - '(set! *rig-stage-hook* (lambda () (rig-set-clock (the time-frame (+ (* (/ (current-time) 36000) 36000) 36000 13700))) (dotimes (i 40) (suspend)) (set! (-> *sunken-mood* state 1) (the-as uint 116)) (set! (-> *sunkenb-mood* state 1) (the-as uint 116)) (pc-set-caustics 7 1933333) (none)))'
  B1: &B1
    - '(sandover-settings-reset! (-> *pc-settings* sandover))'
    - '(sandover-settings-reapply)'
    - '(set! (-> *pc-settings* sandover hdr-output) 2)'
    - '(define-extern pc-set-caustics (function int int none))'
    - '(pc-set-caustics 1 250000)'
    - '(pc-set-caustics 2 1875000)'
    - '(pc-set-caustics 3 250000)'
    - '(pc-set-caustics 4 2440000)'
    - '(pc-set-caustics 5 300000)'
    - '(pc-set-caustics 6 204700)'
    - '(pc-set-caustics 0 1000000)'
    - '(set! *rig-stage-hook* (lambda () (rig-set-clock (the time-frame (+ (* (/ (current-time) 36000) 36000) 36000 13700))) (dotimes (i 40) (suspend)) (set! (-> *sunken-mood* state 1) (the-as uint 116)) (set! (-> *sunkenb-mood* state 1) (the-as uint 116)) (pc-set-caustics 7 1933333) (none)))'
  B2: &B2
    - '(sandover-settings-reset! (-> *pc-settings* sandover))'
    - '(sandover-settings-reapply)'
    - '(set! (-> *pc-settings* sandover hdr-output) 2)'
    - '(define-extern pc-set-caustics (function int int none))'
    - '(pc-set-caustics 1 250000)'
    - '(pc-set-caustics 2 1875000)'
    - '(pc-set-caustics 3 250000)'
    - '(pc-set-caustics 4 4885000)'
    - '(pc-set-caustics 5 300000)'
    - '(pc-set-caustics 6 204700)'
    - '(pc-set-caustics 0 1000000)'
    - '(set! *rig-stage-hook* (lambda () (rig-set-clock (the time-frame (+ (* (/ (current-time) 36000) 36000) 36000 13700))) (dotimes (i 40) (suspend)) (set! (-> *sunken-mood* state 1) (the-as uint 116)) (set! (-> *sunkenb-mood* state 1) (the-as uint 116)) (pc-set-caustics 7 1933333) (none)))'
defaults:
  resolution: [3840, 2160]
  msaa: 4
  hour: 12
  effects: on
  particles: on
  jak: show
  settle_frames: 120
  actors: freeze
