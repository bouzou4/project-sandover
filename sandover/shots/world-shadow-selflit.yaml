# Self-lit textures under the world sun map (fix/world-shadow-selflit-textures): glow prop
# crystals by day. Run with `--play-look`; before = master bin, after = the branch bin.
# Mountain Pass cameras from mountain-pass-crystals.yaml (ogr-cave-crystal-01: self-lit once its
# prop row is in prop_lights.json); cave cameras are the bug-report cameras 0020 and 0022 at
# their bundle resolution (their vanilla frames are reused); snow from crystal-lights.yaml.
set: world-shadow-selflit
defaults:
  resolution: [2560, 1440]
  msaa: 4
  settle_frames: 90
  effects: on
  wind: off
  particles: off
  jak: hide
