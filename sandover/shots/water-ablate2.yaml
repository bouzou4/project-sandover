# Reproducible ablation for #282 (the mid ocean envmap holes), step 2: the passes after
# water_shade at the beach snapshot camera, 3 frames each (debug views 10-13). Run with
# --preset water=bold; each shot sets the view, foam and absorption itself.
set: water-ablate2
defaults:
  resolution: [3840, 2054]
  msaa: 4
  settle_frames: 120
  effects: on
  wind: off
  particles: off
  jak: show
