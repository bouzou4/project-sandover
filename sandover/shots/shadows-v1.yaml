# actor shadow spike: day arc and night at two spots, a busy jungle spot and the jungle
# temple top (precursor metal) at noon; the lamp spot is shadows-lamp.yaml. Run once per variant with --goal forms; see
# kb/howto/shadows.md.
set: shadows-v1
defaults:
  resolution: [2560, 1440]
  msaa: 4
  settle_frames: 60
  camera: from_continue
  effects: off
  wind: off
  particles: off
  jak: show
generate:
  from: continue_points
  continues: [village1-hut, beach-start]
  hours: { h08: 8, h12: 12, h16: 16, h23: 23 }
shots:
  - { name: jungle-start-h12, continue: jungle-start, hour: 12 }
  # Jak moved onto the temple tower top next to the power cell, low camera from the tower side
  - { name: jungle-temple-top-h12, continue: jungle-start, hour: 12,
      jak_pos: [1456966.9, 454246.4, -972185.6], camera: {pos: [1471631.1, 457932.8, -987746.5], rot: [0.7278, 0.0, 0.6858, -0.2454, 0.9338, 0.2604, -0.6404, -0.3578, 0.6796]} }
