  # neighbours.yaml high-noon)
  - {name: beach-shore, continue: beach-start, hour: 15, camera: {pos: [-716800.0, 11468.8, -184320.0], rot: [-0.707107, 0.0, -0.707107, 0.019992, 0.9996, -0.019992, 0.706824, -0.028273, -0.706824]}}
