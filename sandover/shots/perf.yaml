# Performance profile spots for sandover-perf (kb/howto/perf.md): one instance visits each spot
# with every Sandover effect on (the play defaults), waits for the vista loader, then reads the
# engine's PERF-* timer windows, optionally once per effect switched off.
# Cameras come from other manifests (named per shot) so the frames can be compared with them.
# Particles, wind and time-of-day effects are on: frames should cost what play costs.
set: perf
defaults:
  resolution: [3840, 2160]
  msaa: 2
  settle_frames: 120
  effects: on
  wind: on
  particles: on
  jak: show
  wait_vista: true
  wait_log_timeout: 90
shots:
