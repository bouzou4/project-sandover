# World sun map (#366): the static world casts sun shadows into cascades, and the world, actors and
# water take them. Cameras reuse frames that exist:
# - village1-edge-1500: terrain-sun-001/A/edge (16:00), Jak beside a palm on grass
# - beach-arch-1315: terrain-sun-005/B (roof cover parity)
# - jungle-tunnel-1200 and -1830: retired, the camera sits inside a machine; never shoot them
# - beach-whole-1730: sky-hue-003/A/beach-whole-midday, long evening shadows
# Arms, one instance each:
#   A play look today: --play-look --goal-after-load "(pc-set-shadow-option 32 0)"
#                      --goal-after-load "(pc-set-shadow-option 33 0)" --goal-after-load "(pc-set-shadow-option 34 0)"
#   B map on:          --play-look (engine defaults: options 32-34 on)
set: world-sun-shadows-002
defaults:
  resolution: [2560, 1440]
  msaa: 4
  settle_frames: 60
  effects: on
  wind: off
  particles: on
  jak: show
shots:
  - {name: village1-edge-1500, continue: village1-hut, hour: 15, jak_pos: [260096.0, 58368.0, -250880.0],
     camera: {pos: [278921.5, 67809.3, -273943.3], rot: [0.858, 0.0, 0.5137, -0.1076, 0.9778, 0.1798, -0.5023, -0.2095, 0.8389]}}
