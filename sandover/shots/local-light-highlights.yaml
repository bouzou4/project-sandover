# Local-light highlights: every tile light, world light and actor light adds a GGX lobe from
# the material shading's roughness and F0 (per texture: class, roughness map, metallic), carried
# to the tile-light pass in the emissive mask's b and a. Porous classes in enclosed (one palette
# slot) levels read damp. Arms per shot: C original game (no forms; the rig boots all off),
# A today (play look, highlights off), B1 (strength 2, soft limit 1.5), B2 (strength 4, limit 3).
# Each arm's forms are ONE after-load string (the play look first, then the highlight forms), so
# the settings push cannot land after the A/B parameters. Vanilla first; actors frozen (default).
# Cameras are copied from the sidecars of captured frames ($SANDOVER_DATA):
# - maincave-mushrooms-jak: crystals-011/B/maincave-tallshroom-crate.png (cave
#   floor under the glowing mushroom patch, Jak, chests with metal bands)
# - village1-hut-lamps-night: shots/final-gate6-ab/A/village1-hut-lamps.png (22:29, hut lamps
#   over a metal crate, barrel hoops, wood floor, stone hearth)
# - sunken-precursor-pad: shots/final-gate6-ab/A/sunken.png (precursor door and dais round the
#   glowing cyan pad)
# - darkcave-unlit-control: darkcave-fix/fix-unlit/darkcave-0024.png (no crystal
#   lit; B must equal A)
set: local-light-highlights
defaults:
  resolution: [2560, 1440]
  msaa: 4
  settle_frames: 120
  effects: on
  wind: on
  particles: on
  jak: show
shots:
