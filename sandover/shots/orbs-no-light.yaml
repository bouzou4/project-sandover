# Orbs light nothing, cells do (design decision 2026-09-26). Geyser rock's gimmie cell with the
# three orbs behind it on the sand, noon and dusk: pools under the cell, none under the orbs.
# Village1 dusk is `sandover-capture from-snapshot` of runs/20260925-1812-play/0009.json
# (orbs only; village1 has no free-standing cell). Forms: PR description.
# Camera: 12 m from the cell (fuel-cell-55), 4.5 m over the sand, aimed at it (frame centre); the
# three orbs 19-25 m deep, right of it. Clear lines to all four, nearest geometry 4.2 m, open sky.
# Convention checked on eco-emitters jungle-top-cell (rows = inv-camera-rot, fuel-cell-1 lands centred).
set: orbs-no-light
defaults:
  resolution: [2560, 1440]
  msaa: 4
  settle_frames: 90
  camera: from_continue
  effects: on
  wind: off
  particles: on
  jak: hide
shots:
  - {name: training-cell-orbs-noon, continue: training-start, hour: 12, camera: {pos: [-4901908.9, 82796.3, 4083673.3], rot: [-0.342, 0.0, 0.9397, -0.1954, 0.9781, -0.0711, -0.9192, -0.2079, -0.3345]}}
  - {name: training-cell-orbs-dusk, continue: training-start, hour: 19, camera: {pos: [-4901908.9, 82796.3, 4083673.3], rot: [-0.342, 0.0, 0.9397, -0.1954, 0.9781, -0.0711, -0.9192, -0.2079, -0.3345]}}
