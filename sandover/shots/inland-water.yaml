# Inland water revision 3: C original (all-off boot state, shot first), A today (play look,
# inland water off), P as picked in revision 1 (pc-set-inland-water 11; no longer a preset: the
# game's water with only its envmap layer dropped on sky levels; this is revision 1's B on Merc2
# sky-level water, where a merc view-vector sign bug disabled the shading; revision 1's B also
# gave Generic2 water (sunken pools, not in this round) its depth fade, which P turns off), B1 the rule as designed with that bug
# fixed (`inland`, absorption 1.5 m), B2 the same clearer (3 m). Same cameras.
# Same frame in every arm: each shot's stage hook moves all game clocks to 100000 s (rig-set-clock,
# also the ripple phase) and A/P/B pin the Sandover wave clock at 120 s (pc-set-water 90), as
# shore-wet.yaml. Particles off (the fountain spray is not the subject).
# One instance (--parallel 1): looks persist within an instance, so C comes first; every shot
# carries its whole look as an explicit form list (no reapply of settings). Cameras were picked
# offline over each surface (water mask = entity vol boxes with background below the surface,
# view rays checked against the background mesh; instanced wind TIE not checked).
set: inland-water
defaults:
  resolution: [2560, 1440]
  msaa: 4
  settle_frames: 90
  effects: on
  wind: on
  particles: off
  jak: show
