# Darkcave: Jak, crates and enemies light up with a lit crystal (cave-crystal fix).
# Spots and cameras from perf.yaml (darkcave-0024, -0025, the play snapshots 0024 and 0025).
# 0024: Jak 20 m from cavecrystal-3 (aid 347), crate-3021 by the crystal.
# 0025: Jak 14 m from cavecrystal-4 (aid 348), crate-3022 13 m to his side.
# Lit: one run per shot with the stage hook attacking that shot's crystal, e.g.
#   --only darkcave-0024 --goal '(set! *rig-stage-hook* (lambda () (send-event (process-by-ename "cavecrystal-3") (quote attack)) (none)))'
#   --only darkcave-0025 --goal '(set! *rig-stage-hook* (lambda () (send-event (process-by-ename "cavecrystal-4") (quote attack)) (none)))'
# Unlit: the same shot without the hook (must match master).
set: darkcave-crystal-light
defaults:
  resolution: [2560, 1440]
  msaa: 4
  settle_frames: 120
  effects: on
  wind: off
  particles: on
  jak: show
  actors: live           # the hook's crystal attack plays out after the settle frames
shots:
  - {name: darkcave-0024, continue: darkcave-start, hour: 14.9664, jak_pos: [3831361.5, 158281.875, -11795829.0], camera: {pos: [3873233.0, 177109.719, -11804118.0], rot: [0.196384, 0.0, 0.980527, -0.134885, 0.990493, 0.027015, -0.971205, -0.137564, 0.194517]}}
  - {name: darkcave-0025, continue: darkcave-start, hour: 12.2589, jak_pos: [3539527.75, 231473.859, -11801888.0], camera: {pos: [3558064.25, 252568.062, -11754170.0], rot: [-0.962138, 0.0, 0.272563, -0.031377, 0.993352, -0.110761, -0.270751, -0.11512, -0.955741]}}
