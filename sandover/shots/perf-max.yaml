# Max-tier profile spots (2026-10-10, kb/findings/2026-10-10-perf-profile.md): the 21 perf.yaml
# spots plus the places the features merged since 2026-10-08 cost most. The max tier comes from the
# settings reset sandover-perf sends after each load (temporal AA, the shipped AA), not
# from this file.
# Cameras reuse frames that exist: village1-trees-1500 is world-sun-shadows.yaml village1-edge-1500;
# beach-whole-1730/1820 is its beach-whole-1730; round water/sun-glint-002 (windmill, waterfront,
# river); shore-wet training-shore; the fix-emissive-tiles captures 0018 (snow switch field) and
# 0022 (citadel lamps); showcase swamp-game-rain-1449 (eco blob); lavatube-field-1200 is the
# lava-rules lavatube-start-A-today camera.
set: perf-max
defaults:
  resolution: [3840, 2160]
  msaa: 2
  settle_frames: 120
  effects: on
  wind: on
  particles: on
  jak: show
  wait_vista: true
  wait_log_timeout: 180
