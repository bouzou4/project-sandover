# Lava rules verification (the picked look, `strong`, now the engine default): three lava
# cameras as vanilla (original game: no look forms, the rig boots all off), A today (the play look,
# lava rules off) and C `strong`, to compare against revision 6's C-strong-H1: only the dark band on
# the canyon walls (lava-class crust darkened on walls) should change. The two
# firecanyon-diag-*-racer-death shots at the end are run separately (--only); the B look is kept
# for them. Run with the lava candidate materials (SANDOVER_MATERIALS / SANDOVER_PBR_MAPS =
# $SANDOVER_DATA/materials/candidates/lava-materials.csv / lava-pbr-maps); vanilla has PBR off.
# One instance (--parallel 1); vanilla first.
# Noise pinned: particles off (steam, sparks); every shot's stage hook moves all game clocks to
# 100000 s (rig-set-clock); B/C/D hold the lava clock at its mean (pc-set-lava 14), keeping the
# mood's fades. The vanilla lava palette pulse itself is not pinnable from here.
# Cameras, each from a captured frame (BUILD-RULES camera rule):
# - firecanyon-canyon: lava-rules-002/firecanyon-canyon-*.png (revision 2):
#   11 m over the road at (141, 42, -468) m looking down the canyon. Jak stays at the continue
#   point (out of frame): placed on the road he sits on hotcoals and lava on the zoomer, overheats
#   and dies during the hold (heat 3/s on hotcoals, 20/s on lava, death at 100;
#   target-racer.gc:475-500), so each arm caught a different phase of the death (revision 5: the
#   vanilla shot shows him thrown off the exploded zoomer, A after the respawn, B/C mid-death).
# - lavatube-start: the lavatube-start continue camera, as lava-rules-001/
#   lavatube-start-*.png (lava field, crust pillars, lavafall; Jak on the launch pad). Revision 2's
#   offline-picked cavern camera faced a rock wall.
# - village3-lake: the village3-start golden camera, as lava-rules-002/village3-lake-*.
# Ogre is out of this round (its camera ended inside the boss model in revision 3).
# Every arm sets the debug view off explicitly (pc-set-lava 10 0).
# Each look is the 0018 session's toggles (the play look) minus HDR output.
