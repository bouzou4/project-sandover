# Wet rock revision 5: B1 of revision 4 was kept, with the tide line too high.
# The kept look is the spec; only the splash zone's height changes. Under the gloss toggle,
# non-sand surfaces by the sea are wet in a splash zone with a world-noise edge and wet streaks up
# steep faces (both scaled with the zone's fade height), darkened in linear light with +50%
# chroma, under a water film in the PBR inputs. Sand keeps the picked band.
# Arms: C original game (the clock pin only; the rig boots all off), A the selected shoreline (dry
# rock: play look + wet shoreline + swamp look, gloss off), B1 the chosen wet rock as seen
# it (fully wet to 2.5 m, dry at 4 m), L1 (1.2 m / 2.0 m), L2 (0.7 m / 1.3 m); everything else in
# L1 and L2 is B1's. Vanilla first, one instance (--parallel 1), actors frozen (rig default).
# Every arm's stage hook moves the game clocks to 100000 s 4 frames before the shot; A, B1, L1, L2
# also pin the Sandover wave and rain-ring clock (pc-set-water 90).
# Cameras and the frames they come from (all under $SANDOVER_DATA), as revision 4:
# - beach-rock-sun (9 h): wet-pbr-003/beach-rock-sun-*.png, the rocks at the tower
#   foot.
# - beach-pillars (13.9 h): orbs-001/candidates/A/nosup-0003.png, rock
#   pillars standing in the sea; Jak placed as in that frame.
# - village1-waterfront (16 h): shore-002/village1-dock-A-today.png, pilings and
#   stilt houses at the water.
# - swamp-dock1 (14.82 h): wet-pbr-003/swamp-dock1-A-picked.png, its continue camera
#   made explicit; 300 settle frames; particles off. The swamp has no splash zone, so B1, L1 and
#   L2 are the same there (the film on its wet surfaces).
# Each look is the play look minus HDR output, as swamp-directions.yaml.
