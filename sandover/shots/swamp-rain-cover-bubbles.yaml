  - {name: mud-bubbles-vanilla, continue: swamp-start, camera: {pos: [1338572.8, 12288.0, -8806850.6], rot: [0.866019, 0.000000, -0.500011, 0.038459, 0.997038, 0.066611, 0.498530, -0.076916, 0.863454]}}
