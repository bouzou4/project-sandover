# Swamp fixes (fix/swamp-rain-cover-bubbles): rain needs open sky (no rain rings, puddles or soaked
# ground under a roof, cave or overhang; soft edge at cave mouths) and the mud bubbles take the
# swamp mist and the fog floor. Arms: C original game (the `-vanilla` shots: no forms, the rig
# boots all off), A master and B the fix: the `-play` shots, captured once with master's bin (A)
# and once with bin fix-swamp-rain-cover-bubbles (B); the look is the same play look in both.
# Vanilla first; one instance. Clocks pinned (rig clock, water clock 120 s, which the rain rings
# use); actors live and particles on so the rain and the bubbles run.
# - cave3-mouth: the swamp-cave3 continue camera (the game's own), inside the hollow tree looking
#   along the plank walk to the opening; no captured frame exists, so it comes with an offline
#   render of the swamp geometry from that camera with the cover rule painted
#   (scratchpad render-cave3-cover.png: 93% covered, the planks at the mouth open, 10% in the edge).
# - mud-bubbles: new, 3 m over the mud channel at (326.8, 3, -2150.1) m looking north-east along
#   it at group-swamp-bubbles-03 (35 m) and -02 (80 m), both unoccluded in the offline render
#   (render-mud-bubbles.png; nearest surface 5 m).
# - play-0017-open: the maintainer's frame runs/20260926-1011-play/0017 (open swamp, Jak placed), the
#   control: open-sky rain rings and puddles must stay as master draws them.
# - dock1-trees: the swamp-dock1 camera of the picked round (wet-pbr-001), the
#   documented change: the planks under the giant trees' high branches count as covered (anything
#   solid overhead does, by the maintainer's call), so they lose their puddles and rings there.
set: swamp-rain-cover-bubbles
looks:
  play: &play  # the play look (minus HDR output), as shore-wet.yaml
    - '(set! *rig-stage-hook* (lambda () (rig-set-clock (seconds 100000)) (none)))'
    - '(pc-set-ssao-preset 4)'
    - '(pc-set-bloom 0 1000000)'
    - '(pc-set-bloom 4 1000000)'
    - '(pc-set-ssao-param 15 1000000)'
    - '(pc-set-emissive-lights 0 1000000)'
    - '(pc-set-shadows 1 1.0)'
    - '(pc-set-shadow-option 5 300000)'
    - '(pc-set-fur 0 1000000)'
    - '(pc-set-water 0 1000000)'
    - '(pc-set-water 90 120000000)'
    - '(pc-set-pbr-param 0 1)'
    - '(pc-set-vista-fog "unified" 150 150 800)'
    - '(define-extern pc-set-vista-neighbour-fog (function string int int int none))'
    - '(pc-set-vista-neighbour-fog "clear" -1 -1 -1)'
    - '(define-extern pc-set-vista-haze (function int int int int none))'
    - '(define-extern pc-set-vista-neighbour-haze (function string int none))'
    - '(pc-set-vista-haze 850 200 #x8d8f80 700)'
    - '(pc-set-vista-neighbour-fog "misty" 16000 #x7a7771 -1)'
    - '(pc-set-vista-neighbour-haze "misty" 0)'
    - '(pc-set-vista-neighbour-fog "rolling" 10000 #x6a6978 -1)'
    - '(pc-set-vista-neighbour-fog "village2" 16000 #x656581 -1)'
    - '(pc-set-vista-neighbour-fog "training" 7000 #x767371 -1)'
    - '(pc-set-vista-neighbour-haze "training" 0)'
    - '(pc-set-vista-option 5 (the int (&-> *time-of-day-context* time)))'
    - '(pc-set-vista-option 12 1)'
    - '(pc-set-vista "neighbours")'
    - '(pc-set-hdr-target #t)'
    - '(pc-set-tonemap 0 2000000)'
defaults:
  resolution: [2560, 1440]
  msaa: 4
  settle_frames: 120
  hour: 14.819
  effects: on
  wind: on
  particles: on
  actors: live
  jak: hide
