# Terrain sun cover revision 3: an actor under a roof or other cover overhead loses the sun's share
# of its light rig as a whole (one value per actor, from the level heightfield around its root);
# the game's designed light kits (hut interiors, NPCs) are kept; its sun shadow fades whole,
# penumbra included. Open ground is never touched. Shadow option 20.
# Run four times, one instance each, D first (toggles persist within an instance):
#   D original game: no flags (the rig boots everything off)
#   A today:         --play-look --goal "(pc-set-shadow-option 20 0)"
#   B partial:       --play-look --goal "(pc-set-shadow-option 20 600000)"
#   C full:          --play-look --goal "(pc-set-shadow-option 20 1000000)"
# effects and particles stay on: the hut lamps' palette slot (flames, slot 5) is driven by
# update-mood-flames only while time-of-day effects run.
# The first four cameras are revision 2's. New:
# - hut-night-2230: play snapshot 0011's camera and Jak (runs/20260926-1011-play/0011.json),
#   22:29, no sun; hut lamps 1196 and 1197 at 6.7 and 7.7 m light and shadow him.
# - misty-room-1300: Jak in a roofed room in misty (ceiling about 4 m up, walls 5-14 m, open on
#   one side), cover 1.0, no light in the world light table within 14 m, and misty has no light
#   kit regions, so his rig is the sun's: cover alone. Camera 5.5 m from Jak inside the room,
#   picked offline (clear rays to feet, middle, head; 1.9 m clearance).
set: terrain-sun-003
defaults:
  resolution: [2560, 1440]
  msaa: 4
  settle_frames: 60
  effects: on
  wind: off
  particles: on
  jak: show
