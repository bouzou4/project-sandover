# Parallax self-shadow: the parallax close-ups (parallax-close.yaml) and the jungle temple
# top (parallax.yaml), 4K, --play-look (temporal AA, FSR 3.1 at 100 %).
# One instance; every shot carries its arm: off / moderate (option 43 1) / strong (43 2).
# Probe pair first (stone wall off then strong): the runner aborts unless they differ.
set: pom-shadow-001
x-arms:
  off: &off ["(pc-set-shadow-option 41 0)", "(pc-set-shadow-option 42 0)", "(pc-set-shadow-option 43 0)"]
  moderate: &moderate ["(pc-set-shadow-option 41 0)", "(pc-set-shadow-option 42 0)", "(pc-set-shadow-option 43 1000000)"]
  strong: &strong ["(pc-set-shadow-option 41 0)", "(pc-set-shadow-option 42 0)", "(pc-set-shadow-option 43 2000000)"]
defaults:
  resolution: [3840, 2160]
  msaa: 2
  settle_frames: 120
  effects: on
  wind: off
  particles: off
  jak: show
shots:
  - {name: probe-pom-off, continue: village1-hut, hour: 12, camera: {pos: [-430498.2, 44583.9, 324637.4], rot: [-0.918293, 0.0, 0.395902, 0.018426, 0.998916, 0.042738, -0.395473, 0.046541, -0.917298]}, goals_after_load: *off}
