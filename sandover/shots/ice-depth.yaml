# Ice with depth: class `ice` gets a glossy fresnel coat over a darker, bluer inner layer
# (the texture sampled again below the surface along the refracted view ray, tinted by its own
# colour over the path length), a sharp sun lobe, and the sun through thin ice (faces turned
# from the sun, edges seen toward it). Param 40 (`pc-set-pbr-param 40 n`, millionths) is the
# strength; 0 = off, where `ice` rows shade as stone.
# Arms per shot: C original game (no forms), A today (play look, ice off), B1 (strength 1),
# B2 (strength 2.5). Each arm's forms are ONE after-load string, play look first.
# Material table: the live table (B1 was chosen; the 17 ice rows are
# applied live, so no SANDOVER_MATERIALS). A at param 40 = 0 shades the ice rows as stone.
# (17 rows to `ice`: snow-ice x2, snow-ice-trans-01, snow-icewall*, snow-fringe-01,
# icecube-ice-01/-corner/-nails; list in candidates/ice-corrections.csv). PBR maps unchanged.
# snow-crystals stays `special`: it is a light source and must keep its glow.
# Cameras ($SANDOVER_DATA):
# - ice-lake-noon: NEW position (no captured frame shows the frozen lake; the nearest, rounds/
#   emissive-lights/world-002/candidates/A/snow-entity-snow-bumper-71.png, is at night and
#   shows snow, not the lake). 7 m above the lake by the fort, looking across it toward the
#   fort wall; offline render of this camera attached to the PR round notes (lake sunlit at 12 h).
# - ice-crystal-crate: crystals-011/B/snow-crystal-crate.png, camera unchanged
#   (ice walls and the ice crystal, Jak beside it; the cave is in shade at 12 h).
# - ice-lake-sun-front: NEW position, same lake, east end, looking toward the 7.5 h sun
#   (19 degrees up, just above the frame top): sun lobe on the lake and backlit edges.
# - icecube-spikes: the ice-cube enemy (entity ice-cube-11, path point 0 on the frozen lake by the
#   fort) close up with its spikes out. Camera derived from ice-depth-003/
#   ice-lake-noon-B1.png (same heading, moved to 5 m from the enemy, 2.6 m up; offline render
#   candidates/ice-shots/offline-icecube-spikes.png). A stage hook (in every arm, vanilla
#   included) places the enemy there facing the camera, forces its become-mean state (spikes
#   extend) while the other actors stay held, re-holds it when the spikes are out, prints
#   RIG:ICE-CUBE posed, and clears itself.
# - snow-control-0004: snow-glints-003/A/snow-0004-glints.png (from
#   runs/20260928-0934-play/0004): snow, rock and wood only; B must equal A.
set: ice-depth
defaults:
  resolution: [2560, 1440]
  msaa: 4
  effects: on
  wind: off
  particles: off
  jak: show
