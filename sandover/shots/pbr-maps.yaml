# per-texture maps: the pbr-classes spots (village1, beach, jungle, jungle tower, village1
# oracle; noon and dusk) plus the jungle temple top (eco-emitters camera) at noon and night.
# Run with SSAO, bloom and actor shadows on; see kb/howto/materials.md "Per-texture maps".
set: pbr-maps
defaults:
  resolution: [2560, 1440]
  msaa: 4
  settle_frames: 60
  camera: from_continue
  effects: on
  wind: off
  particles: off
  jak: show
generate:
  from: continue_points
  continues: [village1-hut, beach-start, jungle-start, jungle-tower]
  hours: { noon: 12, dusk: 18 }
shots:
