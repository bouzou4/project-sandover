# Synthetic VR eye images (kb/howto/vr-synthetic.md): the real OpenXR session with a scripted
# head pose; each XR shot also writes <name>-left.png / -right.png read back from the swapchains.
# Mono shots: run without XR. XR shots: run with --goal "(pc-set-xr #t)" (headset on SteamVR).
set: vr-synthetic
defaults:
  resolution: [1920, 1080]
  msaa: 4
  settle_frames: 60
  camera: from_continue
  effects: on
  wind: off
  particles: off
  jak: show
  actors: freeze
shots:
  - { name: village1-hut-mono, continue: village1-hut, hour: 12, goals_after_load: ["(define-extern pc-set-xr-fake (function symbol none))", "(define-extern pc-set-xr-fake-option (function int int none))", "(pc-set-xr-fake #f)"] }
  - { name: beach-start-mono, continue: beach-start, hour: 12, goals_after_load: ["(define-extern pc-set-xr-fake (function symbol none))", "(define-extern pc-set-xr-fake-option (function int int none))", "(pc-set-xr-fake #f)"] }
  - { name: jungle-start-mono, continue: jungle-start, hour: 12, goals_after_load: ["(define-extern pc-set-xr-fake (function symbol none))", "(define-extern pc-set-xr-fake-option (function int int none))", "(pc-set-xr-fake #f)"] }
  - { name: sunken-start-mono, continue: sunken-start, hour: 12, goals_after_load: ["(define-extern pc-set-xr-fake (function symbol none))", "(define-extern pc-set-xr-fake-option (function int int none))", "(pc-set-xr-fake #f)"] }
  - { name: village1-hut-xr, continue: village1-hut, hour: 12, goals_after_load: ["(define-extern pc-set-xr-fake (function symbol none))", "(define-extern pc-set-xr-fake-option (function int int none))", "(pc-set-xr-fake-option 0 0)", "(pc-set-xr-fake-option 1 0)", "(pc-set-xr-fake-option 2 0)", "(pc-set-xr-fake-option 3 0)", "(pc-set-xr-fake-option 4 0)", "(pc-set-xr-fake-option 5 0)", "(pc-set-xr-fake #t)"] }
