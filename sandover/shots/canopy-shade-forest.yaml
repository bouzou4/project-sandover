# Canopy shade reshoot (first canopy review: "I literally cant see the ground in the main forest area").
# Wide views of the main jungle forest floor as a player sees it: camera 7-8 m over the ground,
# 12-20 m back from the point it looks at, pitched down 14-19 deg, in the forest around (290, -310) m.
# These are new positions (no captured frame existed there); offline renders of each view (crude:
# texture mean colour x sun term, red mark = Jak) are attached to the report, not committed:
# canopy-shade/r_sheet2.png (top-left forest-floor, top-right forest-edge, bottom-right forest-path).
# - forest-floor: under full canopy, the floor and a curving path fill the lower two thirds, Jak
#   10 m ahead (actors >= 15 m away: jungle-actors.json).
# - forest-path: along the path under partial cover (dappled), rock face at the right edge.
# Hours: 12 and 14. Model v4 (after canopy-forest-003, where dirt went near black and grass
# did not change): under the canopy every surface gets the same light multiplier whatever its
# texture, class or bake: shade = today's light x (1 - option 12) shifted cool (option 15); sun
# patches through the leaf gaps at the sun projection = today's light x (1 + option 16 warm). The
# mean cover above the point fades it in; outside the canopy nothing changes; Jak gets the same.
# forest-edge is dropped: half its view is outside the canopy map and the rest barely changed.
# Predicted (sRGB levels on today's frames of canopy-forest-003, shade / sun patch; B1 / B2):
#   forest-floor-12 grass: shade 71 -> 52 / 42, patch 63 -> 69 / 74; dirt: shade 60 -> 43 / 34,
#     patch 46 -> 50 / 53. forest-path-12 grass: shade 61 -> 44 / 35, patch 78 -> 84 / 89; dirt:
#     shade 55 -> 39 / 31, patch 61 -> 66 / 70. Grass and dirt now drop by the same factor.
#   Sun patches cover about 25-40% of the canopy floor (map gaps after a 1 m filter), not
#   checkable on the old frames.
# Bin canopy-shade-7 (an earlier master build), SANDOVER_GK_PROJ_PATH at
# worktrees/canopy-shade-7-root, SANDOVER_DATA set (the v2 maps in lighting/).
