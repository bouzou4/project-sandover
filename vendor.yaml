third-party/openal-soft:
  git: https://github.com/kcat/openal-soft/tree/1.25.2
  license: LGPL 2 or later (BSD-3-Clause and pffft portions; see the license files)
  modifications:
    - "Only the library sources, bundled fmt/gsl, the default HRTF, docs and license files are kept; examples/ (except examples/common, which the CMake file always references), utils/ and CI files are dropped"
    - "Built as a shared library (OpenAL32.dll next to gk)"
    - "common/opthelpers.h: NONBLOCKING is empty with the MSVC STL (clang-cl ABI), whose std::invoke rejects nonblocking member function pointers"
    - "alc/backends/wasapi.cpp: the spatial stream activation blob points at a stack object; the PROPVARIANT is emptied before PropVariantClear frees it (heap corruption on endpoints with spatial sound on)"
third-party/smaa:
  git: https://github.com/iryoku/smaa/tree/71c806a838bdd7d517df19192a20f0c61b3ca29d
  license: MIT
  modifications:
    - "Only LICENSE.txt and the precomputed Textures/AreaTex.h and Textures/SearchTex.h are kept here, line endings LF"
    - "SMAA.hlsl lives in game/graphics/opengl_renderer/shaders (the shader loader reads that folder), licence header kept; the ASCII-art logo comment (lines ending in a backslash, a line continuation GLSL 4.1 rejects) and two non-ASCII middle dots in a comment diagram are removed; no code changed"
game/graphics/opengl_renderer/shaders/ffx:
